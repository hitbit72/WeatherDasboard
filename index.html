<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101214">

    <title>HitBit Dashboard</title>

    <!-- =====================================================
         ESTILOS
    ====================================================== -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>

<div id="app">

    <!-- =====================================================
         CABECERA
    ====================================================== -->

    <header id="header">

        <!-- ==============================
             RELOJ
        =============================== -->
        <section id="clock-panel" class="panel">
            <h1 id="clock-time">--:--</h1>
            <p id="clock-weekday">------</p>
            <p id="clock-date">-- ------- ----</p>
        </section>

        <!-- ==============================
             TIEMPO ACTUAL
        =============================== -->
        <section id="weather-panel" class="panel">
            <div id="city-name">--</div>
            <div class="weather-now">
                <div class="weather-icon-now">
                    <img id="weather-icon" src="assets/icons/weather/unknown.svg" alt="Tiempo">
                </div>
                <div class="weather-details-now">
                    <div id="weather-temperature">--°</div>
                    <div id="weather-description">Cargando...</div>
                </div>
            </div>
        </section>
    </header>

    <!-- =====================================================
         DATOS ACTUALES
    ====================================================== -->
    <section id="metrics">
        <!-- JavaScript genera las tarjetas -->
    </section>

    <!-- =====================================================
         PREVISIÓN SEMANAL
    ====================================================== -->
    <section id="forecast">
        <!-- JavaScript genera los 7 días -->
    </section>

    <!-- =====================================================
         PIE
    ====================================================== -->
    <footer id="footer">
        <span>HitBit Dashboard v1.0</span>
        <div class="footer-right">
            <div id="dashboard-status">Inicializando...</div>
            <button id="settings-btn" type="button" aria-label="Ajustes de ubicación">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </footer>
</div>

<!-- ==========================================================
     PANTALLA DE CARGA
=============================================================== -->
<div id="loading-screen">
    <div class="loader"></div>
    <p>
        Cargando datos...
    </p>
</div>

<!-- ==========================================================
     FORMULARIO DE UBICACIÓN
     Solo se muestra si no hay ubicación guardada en localStorage
=========================================================== -->
<div id="location-screen" class="hidden">
    <form id="location-form" class="panel">
        <h2>Configura tu ubicación</h2>

        <label for="location-city">Ciudad</label>
        <div class="input-with-button">
            <input
                type="text"
                id="location-city"
                placeholder="Ej. Jimena, Jaén"
                required>
            <button type="button" id="geolocate-btn" aria-label="Usar mi ubicación actual">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s7-7.05 7-12A7 7 0 0 0 5 10c0 4.95 7 12 7 12z"></path>
                    <circle cx="12" cy="10" r="2.5"></circle>
                </svg>
            </button>
        </div>

        <label for="location-latitude">Latitud</label>
        <input
            type="number"
            id="location-latitude"
            step="any"
            min="-90"
            max="90"
            placeholder="Ej. 37.8383"
            required>

        <label for="location-longitude">Longitud</label>
        <input
            type="number"
            id="location-longitude"
            step="any"
            min="-180"
            max="180"
            placeholder="Ej. -3.5192"
            required>

        <button type="submit">Guardar y continuar</button>
        <button type="button" id="location-cancel" class="hidden">Cancelar</button>
        <p id="location-error" class="hidden"></p>
    </form>
</div>

<!-- ==========================================================
     JAVASCRIPT
=========================================================== -->
<script src="assets/js/config.js"></script>
<script src="assets/js/weatherCodes.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/location.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/weather.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>

</html>
